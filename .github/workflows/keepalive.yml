name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render keep-alive port
        run: |
          echo "Pinging at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -fsS https://jbh12-mybot-2026.onrender.com || echo "Ping failed, will retry next round"

